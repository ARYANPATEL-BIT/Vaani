# ASR slow tests — run the tests that load a REAL Whisper model.
#
# Kept out of the main CI job (ci.yml) on purpose: they need the model named
# in backend/config.toml (cpu/small, a few hundred MB from Hugging Face) and
# seconds of CPU per test. So this workflow runs only when speech-recognition
# code, the dependencies, or this file change, or when started by hand.
#
# The downloaded model is cached between runs, keyed on config.toml: the
# download is paid again only when that file (which names the model) changes.

name: ASR slow tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/vaani/asr/**"
      - "backend/vaani/turns.py"
      - "backend/config.toml"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/tests/test_asr_*.py"
      - ".github/workflows/asr-slow.yml"
  workflow_dispatch:

jobs:
  asr-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      - name: Install Python
        run: uv python install

      # CPU only: no --extra gpu, so no NVIDIA libraries are downloaded.
      - name: Install dependencies
        run: uv sync --frozen

      # Hugging Face's download cache, where faster-whisper puts the model.
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-${{ runner.os }}-${{ hashFiles('backend/config.toml') }}

      - name: Pytest (slow only)
        run: uv run pytest -m slow -s
