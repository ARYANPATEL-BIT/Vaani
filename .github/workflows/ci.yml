# CI — lint and test the backend on every pull request into dev or main.
#
# The job installs uv, restores the EXACT locked dependencies (uv.lock) so the
# run is reproducible, then runs ruff (lint + format check) and pytest.

name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # A hung test (e.g. waiting for a message that never comes) fails the run
    # in 10 minutes instead of GitHub's 6-hour default.
    timeout-minutes: 10
    defaults:
      run:
        # All steps run inside backend/, where pyproject.toml and uv.lock live.
        working-directory: backend
    steps:
      # Check out the repository at the PR's commit.
      - uses: actions/checkout@v4

      # Install the uv package manager, pinned so CI matches local development.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      # Ensure the Python version from .python-version is available.
      - name: Install Python
        run: uv python install

      # Create the environment from the lockfile exactly. --frozen fails the
      # build if uv.lock is out of date, catching un-committed dependency drift.
      - name: Install dependencies
        run: uv sync --frozen

      # Lint: catch style and bug-prone patterns.
      - name: Ruff lint
        run: uv run ruff check .

      # Formatting must match ruff's formatter.
      - name: Ruff format check
        run: uv run ruff format --check .

      # Piper voices (about 63 MB each) are not committed. CI fetches only
      # the default persona's two voices, Hindi and English: they are the
      # only ones the tests load (the other voices are tested through their
      # committed .onnx.json). Cached, keyed on the config that names them.
      # The script verifies the hashes either way and fails the build on a
      # mismatch.
      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: |
            backend/models/hi_IN-*.onnx
            backend/models/en_US-*.onnx
          key: piper-${{ hashFiles('backend/config.toml') }}

      - name: Fetch models
        run: uv run python scripts/fetch_models.py default

      # Run the test suite. Tests marked `slow` (they load a real Whisper
      # model) are excluded by pyproject's addopts; asr-slow.yml runs them.
      - name: Pytest
        run: uv run pytest
