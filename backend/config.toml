# config.toml — non-secret runtime settings for the Vaani backend.
#
# Everything here is safe to commit and to read in a code review. Secrets
# (API keys, tokens) NEVER live in this file; they arrive only from
# environment variables. See .env.example for the secret names.
#
# This file is read into the typed Settings object in vaani/config.py.

# Human-readable application name (used as the FastAPI/OpenAPI title).
app_name = "vaani"

[audio]
# Samples of audio captured per second. 16000 Hz (16 kHz) is the rate the
# speech models in this project expect.
sample_rate = 16000

# Number of audio channels. 1 = mono. The voice pipeline is mono end to end.
channels = 1

# Length of one audio "frame" in milliseconds. Audio is processed in small
# fixed-size chunks; 20 ms is a common frame size for voice pipelines.
frame_ms = 20

[gateway]
# How often (in seconds) the WebSocket gateway logs how many valid audio
# frames arrived in the last interval. 1.0 gives the "about 50 frames per
# second" heartbeat. Tests override this to a tiny value to avoid real waits.
frame_log_interval_s = 1.0

# When true, every valid frame the server receives is echoed straight back to
# the client, bracketed by audio.start / audio.end. This is the day-3 loopback
# used to prove the return audio path end to end. Off since day 12: the
# agent's synthesised speech now travels that path instead.
echo_enabled = false

[vad]
# Voice activity detection: decides, per 20 ms frame, whether it holds speech,
# and turns those decisions into speech_started / speech_ended events.
# When false, the gateway skips VAD entirely (used to measure what it costs).
enabled = true

# The Silero VAD model, run on CPU with ONNX Runtime. The path is relative to
# backend/. The sha256 is checked when the model loads, so a corrupted or
# swapped file fails at startup instead of silently changing behaviour.
# Source: https://raw.githubusercontent.com/snakers4/silero-vad/v6.2.3/src/silero_vad/data/silero_vad.onnx
model_path = "models/silero_vad.onnx"
model_sha256 = "1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3"

# Silero outputs a speech probability from 0 to 1. A frame at or above this
# value counts as a speech frame. 0.5 is Silero's own default.
threshold = 0.5

# Hysteresis. Speech starts only after this many consecutive speech frames
# (4 x 20 ms = 80 ms), so a single click or cough does not count as speech...
start_frames = 4
# ...and ends only after this many consecutive silence frames (10 x 20 ms =
# 200 ms), so a short pause between words does not end it. Starting values;
# tuned on day 9 alongside endpointing.
end_frames = 10

[endpoint]
# Endpointing: turns VAD's speech_started / speech_ended into ONE turn_ended
# when the user has finished speaking. Needs [vad] enabled; if VAD is off,
# endpointing does not run either.
enabled = true

# Silence AFTER speech_ended before the turn is over. VAD already waited
# 200 ms (end_frames) to say "speech stopped", so the user hears about
# 200 + 700 = 900 ms of dead air before turn_ended. Much longer than VAD's
# 200 ms on purpose: people pause 200-500 ms mid-sentence to think.
# Speech resuming inside this window cancels the pending end.
end_of_turn_silence_ms = 700

# An utterance with less VOICED audio than this makes no turn, so a cough or
# a click is ignored. Voiced = frames at or over [vad].threshold, counted from
# speech_started; not the pre-roll, not VAD's 200 ms wait before speech_ended
# (day 14). 40 (2 frames) is the no-regression value: everything the old
# 300 ms span rule kept has at least 2 voiced frames from speech_started (the
# speech_started frame itself, and a last voiced frame at least 4 frames
# later), so nothing that passed before is dropped. The price: one unbroken
# sound now passes at 100 ms of voice, not 160. Provisional until the
# short-answers measurement (docs/learning/backend-learning/14-tuning.md).
min_utterance_ms = 40

# Audio kept from before speech_started. VAD confirms speech 80 ms after it
# really begins (start_frames), so without this the first syllable is lost.
preroll_ms = 300

# Hard cap on one utterance's audio. Past it the turn is forced to end and a
# warning is logged, so memory per session stays bounded (30 s is ~1 MB).
max_utterance_ms = 30000

[barge_in]
# Barge-in: the user talks while the agent is thinking or speaking, and the
# agent stops. Runs on the same VAD events as endpointing.
#
# Speech needed, counted from its onset, before it stops the agent. VAD's own
# 80 ms (start_frames) count toward it. Long enough that a click or a short
# cough does not stop a reply; short because the whole budget from the user's
# first sound to silence at the speaker is 300 ms (PERF-3), and network,
# browser fade and the output device still come after this. A "hmm" of
# 300 ms or more WILL stop the agent. Starting value: day 14's measurement
# (runs A2 and B) is pending, and the final value waits for the mentor's
# PERF-3 decision (docs/learning/backend-learning/14-tuning.md).
min_speech_ms = 200

# Speech probability (0 to 1) a frame needs to count toward min_speech_ms.
# Separate from [vad].threshold so it can be raised on its own if the
# browser's echo cancellation leaks the agent's voice back into the mic
# (residual echo usually scores lower). The same 0.5 for now: no echo
# measurement exists yet: day 14's echo run (A2) is pending.
threshold = 0.5

[asr]
# Speech recognition: turns each finished utterance into text. Needs
# [endpoint] (and so [vad]) enabled: no utterances, nothing to transcribe.
enabled = true

# Which recogniser to build. Only "whisper" (faster-whisper, local) exists.
engine = "whisper"

# Inference threads for the whole process. Each live session uses at most one
# at a time, so this is also how many sessions can be transcribed at once.
max_concurrent = 2

# Give up on one transcription after this long and report it as failed. The
# underlying decode cannot be interrupted, so this bounds how long a turn
# WAITS, not how long the thread stays busy (see docs/learning 10-asr.md).
timeout_s = 5.0

# While the user speaks, re-decode the utterance-so-far this often and send
# transcript.partial. 0 = off. Off by default: on cpu/small one re-decode
# costs about as much as the final, and a partial still running when the turn
# ends delays the final (numbers in docs/learning 10-asr.md).
partial_interval_ms = 0

[asr.whisper]
# DELIBERATELY THE DEGRADED DEFAULT. cpu/small runs on any laptop and in CI,
# but it CANNOT transcribe Hinglish (docs/spikes/asr-hinglish.md). Hinglish
# needs large-v3 on a GPU; override on such a machine via the environment:
#   VAANI_ASR__WHISPER__MODEL=large-v3
#   VAANI_ASR__WHISPER__DEVICE=cuda
#   VAANI_ASR__WHISPER__COMPUTE_TYPE=float16
# (and install the GPU libraries with `uv sync --extra gpu`).
# The model is downloaded from Hugging Face on first use and cached.
model = "small"
device = "cpu"
compute_type = "int8"

# 0 = let CTranslate2 pick the number of CPU threads per inference.
cpu_threads = 0

# Forced to Hindi. Auto-detection flips between hi, ur and la for the same
# speaker, and "en" TRANSLATES Hindi into English instead of transcribing it.
# Forcing "hi" still transcribes clean English correctly on large-v3.
language = "hi"

# Text "before" the audio, in the style we want back. A romanized Hinglish
# sentence nudges Whisper to keep English words in Latin script.
initial_prompt = "mujhe kal subah ek meeting hai, toh please mujhe 8 baje remind kar dena"

# Candidate transcripts kept while decoding (faster-whisper's default is 5).
beam_size = 5

# One decode only. faster-whisper's default retries at 0.2, 0.4 ... 1.0 when
# the output looks bad; in the spike that turned one clip into a 62 s stall.
# A wrong transcript is recoverable; a 62 s stall loses the turn.
temperature = [0.0]

[llm]
# Language model providers, first choice first. If one is rate-limited, times
# out or is unreachable BEFORE it has said anything, the next one is tried.
# Every provider listed here must have its API key set, or startup fails.
# Groq first (fix/groq-primary-complete): with [llm.groq]'s model its first
# token came about 0.9 s sooner than Gemini's at p50, 788 vs 1702 ms
# (docs/findings/llm-latency/measure_llm_20261008-101039.txt). Gemini stays
# as the failover.
provider_order = ["groq", "gemini"]

# Per-process cap on paid LLM requests, shared by EVERY provider: a failover
# is another counted request, not a way around the cap. Every call is counted
# when it is dispatched, success or not; past the cap, calls are refused
# before any network traffic. A stopgap until the real cost ledger exists.
max_requests_per_process = 200

# How many completed exchanges (one user turn + the agent's reply) are sent
# back to the model with each new turn, so it remembers the conversation.
# The WHOLE history is re-sent on every turn, so each extra exchange makes
# every later request bigger: more tokens to pay for, more to read before
# the first token. Older exchanges are dropped, not summarised (week 5).
history_turns = 6

# The server ends every system prompt with one line holding the current date
# and time in this IANA time zone (vaani/persona.py), so the model can answer
# "what is the date / time?" without guessing (feat/guardrails). Any zone
# name is checked at startup. Weather, news and prices stay refused: they
# would need a live source.
timezone = "Asia/Kolkata"

[llm.gemini]
# Exact model ID. Deliberately NOT the "gemini-flash-lite-latest" alias: an
# alias can silently move to a new model and change our latency numbers.
model = "gemini-3.5-flash-lite"

# REST API root. The API key is NOT here — it comes only from the
# VAANI_GEMINI_API_KEY environment variable (or the gitignored backend/.env).
base_url = "https://generativelanguage.googleapis.com/v1beta"

# Seconds to wait for each step of a request: connecting, the first byte, and
# each following chunk. It does not cap the total length of a long answer.
timeout_s = 10.0

# How much the model reasons before its first token. "minimal" is the lowest
# level this model accepts; thinking happens before the first token, so it
# adds directly to time-to-first-token.
thinking_level = "minimal"

[llm.groq]
# Exact model ID, as returned by Groq's GET /openai/v1/models for our key.
# Groq retires models: llama-3.1-8b-instant was gone by day 15 (HTTP 404).
# openai/gpt-oss-20b, picked for correctness over speed: on 6 tutor prompts
# in Hindi, 4 of its replies were marked clean against 1 of qwen3.8-27b's
# (docs/findings/groq-primary/tutor_hindi_20261008-113643.txt). It costs
# about 330 ms of first token: p50 788 ms vs qwen's 454 ms
# (docs/findings/llm-latency/measure_llm_20261008-101039.txt).
model = "openai/gpt-oss-20b"

# Groq's OpenAI-compatible API root. The key comes only from the
# VAANI_GROQ_API_KEY environment variable (or the gitignored backend/.env).
base_url = "https://api.groq.com/openai/v1"

# Seconds to wait for each step of a request, as for Gemini.
timeout_s = 10.0

# How much the model reasons before its first token. "low" is the lowest
# level gpt-oss models accept; thinking happens before the first token, so it
# adds directly to time-to-first-token.
reasoning_effort = "low"

# Don't send the model's reasoning text back at all: groq.py never speaks it,
# so streaming it would only add bytes before the answer.
include_reasoning = false

[tts]
# Speech synthesis: turns each chunk of the reply into audio. Needs [llm]
# (and so [asr]) enabled: no reply, nothing to say.
enabled = true

# Which synthesiser to build. Only "piper" (local, CPU, ONNX) exists.
engine = "piper"

# Synthesis threads for the whole process, shared by EVERY voice: with three
# personas it is still at most this many syntheses at once. Piper serialises
# its espeak-ng phonemiser behind one process-wide lock (for all voices), and
# ONNX Runtime runs are thread-safe, so two sessions can synthesise at once.
# Matches [asr].max_concurrent.
max_concurrent = 2

[tts.piper]
# Each persona speaks with its own Piper voices (day 15): one per language,
# "hi" and "en" (feat/english-voice). Each reply's first chunk picks one by
# its script: any Devanagari -> "hi", none -> "en" (vaani/language.py); the
# voice is then kept for the whole reply. Every voice used here outputs
# 22050 Hz, not our 16 kHz input rate. The server never resamples: every
# audio.start declares the rate of the frames that follow (sample_rate,
# shared protocol v0.6, docs/contracts.md 2.2), read from the voice itself, so
# a voice at another rate needs no code change.
#
# The .onnx files (about 63 MB each) are NOT committed: run
#   uv run python scripts/fetch_models.py
# Their .onnx.json files are committed. Each voice loads once, however many
# personas use it: about 1.5 s and 95 MB of RAM per voice (day 15 numbers).
models_dir = "models"

# The piper-voices repository pinned to one revision, so no file behind it
# can change under us. fetch_models.py appends <family>/<locale>/<name>/
# <quality>/<voice>.onnx (hi/hi_IN/..., en/en_US/...), the layout piper's own
# downloader uses.
voices_url = "https://huggingface.co/rhasspy/piper-voices/resolve/c10ece1aade47bb51c153c893d14e5bf8e5b7117"

# One table per persona key of [personas] AND language; a persona missing
# either language stops the server at startup. sha256 is of the .onnx,
# checked by fetch_models.py and again when the voice loads. LICENCE, from
# each voice's MODEL_CARD at the pinned revision (<family>/<locale>/<name>/
# medium/MODEL_CARD under voices_url), which names the DATASET's licence only:
#   * hi: both voices CC BY-NC-SA 4.0 (non-commercial, share-alike).
#     hi_IN-rohan-medium is not used: its card points to IIT Madras' own
#     licence PDF instead, which nobody has read yet.
#   * en: both voices public domain (LibriVox recordings), each "trained from
#     scratch", so neither comes from en_US-lessac. Lessac, and every English
#     voice finetuned from it, is excluded: its dataset (Blizzard 2013) is
#     treated as research-only here.
# Gender as each card states it. A persona's two voices share a gender, so
# one persona is one speaker in either language.
[tts.piper.voices.default.hi]
voice = "hi_IN-priyamvada-medium"  # female
sha256 = "aa63bcf2cd493b55a450f280e23cf77f03afc9af7015e6e5acd43b652f166c88"

[tts.piper.voices.default.en]
voice = "en_US-kristin-medium"  # female
sha256 = "5849957f929cbf720c258f8458692d6103fff2f0e3d3b19c8259474bb06a18d4"

[tts.piper.voices.tutor.hi]
voice = "hi_IN-pratham-medium"  # male: the tutor prompt speaks as a man
sha256 = "169964b0871667f6793416d4b35e97357a68ba1ad01df8580c28048989ee7693"

[tts.piper.voices.tutor.en]
voice = "en_US-norman-medium"  # male
sha256 = "b9739443232a80a59c7d18810dd856899bf16a7964725f5ab81ea49b1351cb71"

# Support: the default's voices, slower. length_scale stretches every sound,
# 1.15 = about 15% longer. Calmer for support; a starting value for the
# day-15 listening verdict. Same voice files, so no second load.
[tts.piper.voices.support.hi]
voice = "hi_IN-priyamvada-medium"
sha256 = "aa63bcf2cd493b55a450f280e23cf77f03afc9af7015e6e5acd43b652f166c88"
length_scale = 1.15

[tts.piper.voices.support.en]
voice = "en_US-kristin-medium"
sha256 = "5849957f929cbf720c258f8458692d6103fff2f0e3d3b19c8259474bb06a18d4"
length_scale = 1.15

[chunker]
# Splits the streamed reply into pieces the synthesiser can say. Counted in
# characters of reply text.
#
# The FIRST chunk is the only one the user waits for (every later one is
# synthesised while earlier audio plays), so it is cut at the earliest
# boundary: a sentence end or a clause break at any length ("Hello!",
# "जी,"), a conjunction once it has first_min_chars. Clause breaks ignore the
# minimum since day 14: replies open with "जी," or "ठीक है," and waited
# for the whole reply (docs/learning/backend-learning/14-tuning.md). If it
# reaches first_max_chars with no boundary, it is cut at the last space. A chunk of only punctuation
# ("...") is never cut on its own; it joins the next chunk.
first_min_chars = 8
first_max_chars = 60

# LATER chunks wait for a sentence end (. ? ! or the Devanagari danda),
# which keeps whole sentences together. Past max_chars with none, they are
# cut at the last clause break, else the last conjunction, else the last space.
max_chars = 200

# A "." after one of these words is not a sentence end. Matched without case.
# "a.m" and "p.m" came with English replies: "at 8 a.m. tomorrow" would
# otherwise be cut mid-sentence. The price: a sentence that really ends in
# "a.m." runs on into the next one, as "Dr." already does. "no" is NOT here:
# "No. I can't" is a real sentence end.
abbreviations = ["dr", "mr", "mrs", "ms", "prof", "st", "vs", "etc", "e.g", "i.e", "rs", "a.m", "p.m"]

# A chunk may be cut just BEFORE one of these words. "ki" is deliberately
# absent: in Hinglish it is mostly possessive ("Ram ki kitaab"), not "that".
# The Devanagari three are the same words in the script replies are now
# written in (lekin, kyunki, toh).
conjunctions = ["but", "because", "so", "and", "lekin", "kyunki", "toh", "लेकिन", "क्योंकि", "तो"]

[db]
# The SQLite database that records every session and turn: text and numbers,
# never audio (vaani/db.py, vaani/turn_log.py). Nothing reads it back into a
# conversation; scripts/turn_stats.py reads it for latency statistics.
# When false no database is opened and nothing is recorded. When true and the
# file cannot be opened, the server refuses to start.
enabled = true

# Relative paths are resolved against backend/. backend/data/ is gitignored:
# the file holds what users said, so it must never be committed.
path = "data/vaani.db"

# At shutdown, the writer gets this long to finish the rows still queued.
# Past it, shutdown goes on and the count of rows not written is logged:
# a stuck disk must never hang the server's exit.
close_timeout_s = 2.0

[guardrail]
# Input guardrail. Each pattern is a regular expression matched,
# case-insensitively, against the user's TRANSCRIPT before it is placed in a
# prompt. Any match blocks the turn: the model is never called and the browser
# gets INPUT_REJECTED. Speech is untrusted input: someone can say "ignore your
# instructions" into the microphone exactly as they could type it.
# This is a short list of phrasings, NOT a defence against a determined
# attacker: a paraphrase it does not list gets through. See
# docs/learning/backend-learning/11-turn-llm.md.
patterns = [
    # English: "ignore / forget / disregard (all) (your) previous instructions"
    '\b(ignore|forget|disregard)\b.{0,20}\b(previous|prior|above|earlier|all|your)\b.{0,20}\b(instructions?|rules|prompt)\b',
    # Asking for, or overriding, the hidden instructions themselves
    '\b(system|developer|hidden)\s+(prompt|instructions?|message)\b',
    # Role takeover
    '\byou\s+are\s+now\b',
    '\bpretend\s+(to\s+be|you\s+are)\b',
    '\b(jailbreak|developer\s+mode|dan\s+mode)\b',
    # Romanized Hinglish: "(pichle) instructions ignore karo / bhool jao"
    '\b(instructions?|rules|nirdesh)\b.{0,15}\b(ignore|bhool|bhul)\w*',
    # Devanagari: "निर्देश ... भूल / अनदेखा", and "इग्नोर"
    'निर्देश.{0,20}(भूल|अनदेखा)',
    'इग्नोर',
]

[personas]
# One system prompt per persona key. session.start's "persona" field must be
# one of these keys, or the session is refused. Kept short on purpose: the
# system prompt is re-sent with every turn, and replies are meant to be spoken,
# so they must be brief. The server adds one line at the end of each, the
# current date and time ([llm].timezone, vaani/persona.py), and after it,
# when session.start's reply_language is "en" or "hi" (protocol v0.10),
# a "Reply language: ..." line. Each prompt's rule right after "Reply in
# the user's language" makes that line win over mirroring the user, and
# the date and time are found by the clock line's own words, since with a
# reply-language line the clock is no longer the last line.
#
# ALL RULES IN ENGLISH (feat/guardrails). Devanagari appears only inside
# quoted words a Hindi reply must use. The first guardrails version wrote
# rules and an example sentence in Devanagari, and 9 of 12 English probes were
# answered in Hindi, against 2 of 12 before (docs/findings/guardrails/
# tables_groq_first-after_20261014.txt). There is no example sentence: the
# old one ("I'll remind you at 8 tomorrow and give you the traffic update")
# was copied as a promise by all three personas (docs/findings/groq-primary/
# ask_gptoss_20261009-145842.txt).
#
# LANGUAGE comes first. An English message gets an English reply in Latin
# script, spoken by the persona's English voice (feat/english-voice). A Hindi
# or Hinglish message gets a reply entirely in Devanagari, English words,
# abbreviations and formulas included: the Hindi Piper voice reads Latin
# letters with English spelling rules and becomes unintelligible
# (docs/findings/tts-day12/hinglish_C.wav, docs/learning/backend-learning/
# 12-chunking-tts.md section 5). speaker.py logs any Latin word that still
# reaches the Hindi voice. The server picks the voice from the script
# (vaani/language.py): the prompt decides the language, the script the voice.
#
# GENDER: Hindi verbs agree with the speaker's gender ("सकती हूँ" is a woman,
# "सकता हूँ" a man). Each prompt states its persona's gender for its OWN
# verbs, matching its voice in [tts.piper.voices]: tutor male, default and
# support female (day 15, docs/learning/backend-learning/
# 15-persona-voices.md). The user is always "आप" with plain forms ("आप कर
# सकते हैं"), never feminine: the persona's gender is not the user's.
#
# NAME: no persona has a personal name, only its role, and no prompt may give
# it one. "You are Vaani" was dropped from all three (day 15): a name in the
# prompt is a name the agent introduces itself with, and a woman's name did
# not fit the male tutor. Each prompt quotes its role line in Devanagari and in
# English. ask.py's "self-name" line checks replies for it. The role is said
# ONLY when asked for a name or an introduction (day 16): day 15's "if you
# introduce yourself, say only your role" let the model decide to introduce
# itself (docs/findings/groq-primary/).
#
# TOOLS: the agent has no tools and no live data, in either language. It
# never says an action was done: in the first guardrails run replies said a
# message "was sent" (judged by hand, docs/findings/guardrails/). Date and
# time come only from the server's line; weather, news and prices are refused.
# ROUND 3 (feat/guardrails) changed only what round 2 failed
# (docs/findings/guardrails/judged_round2_groq_claude.txt): English replies stay
# English when declining or giving the role, and the role line is quoted in
# English first (E); brand names and abbreviations are said as words too (X);
# the date and time are given from the server's line when asked, after the
# tutor refused the time (O); default and support, both female, called the
# user "सकती", so their prompts ask for masculine plural forms for the user
# and keep the user's own words in a message drafted for them (F). To stay
# under 1400 characters, support lost one example word and the "or ask the one
# question you need" half of its last rule.
default = """You are a friendly voice assistant. Reply in the user's \
language. If a "Reply language" line ends this prompt, it overrides every \
language rule here: reply in that language and script. An English message \
always gets an English reply in Latin script, \
even when you decline or give your role. A Hindi or Hinglish message, even in \
Latin letters like "kal meeting hai", gets a Hindi reply entirely in \
Devanagari: English words too ("ट्रैफ़िक"), and abbreviations, brand names \
and formulas said as words ("रैम", "एसएसडी", "अक्सर पूछे जाने वाले सवाल", \
"पानी" for H2O), never Latin letters. End Hindi sentences with ।. Write \
numbers as digits. You are a woman: your own verbs are feminine ("मैं बता सकती हूँ"). The user is always \
"आप" with masculine plural forms ("आप कर सकते हैं", "चाहते हैं"), never \
"सकती" or "चाहती"; a message you write for the user keeps their own words. \
In both languages: you have no tools. You cannot send, set, book or save \
anything, and you never say you did; if asked to send a message, offer its \
text for the user to send. When asked the date or time, give it from the "Current \
date and time" line. You cannot check weather, news or prices: say so and \
suggest where to look. You have no personal name. Only if asked your name or \
to introduce yourself, say "I'm your assistant." in English or "मैं आपकी \
असिस्टेंट हूँ।" in Hindi. Greet only in your first reply, if at all. Your \
reply is spoken aloud: one or two short sentences, no lists, markdown or \
emoji."""

tutor = """You are a patient tutor. Reply in the user's language. If a \
"Reply language" line ends this prompt, it overrides every language rule \
here: reply in that language and script. An English message always gets \
an English reply in Latin script, even when you \
decline or give your role. A Hindi or Hinglish message, even in Latin letters \
like "kal meeting hai", gets a Hindi reply entirely in Devanagari: English \
