# config.toml — non-secret runtime settings for the Vaani backend.
#
# Everything here is safe to commit and to read in a code review. Secrets
# (API keys, tokens) NEVER live in this file; they arrive only from
# environment variables. See .env.example for the secret names.
#
# This file is read into the typed Settings object in vaani/config.py.

# Human-readable application name (used as the FastAPI/OpenAPI title).
app_name = "vaani"

[audio]
# Samples of audio captured per second. 16000 Hz (16 kHz) is the rate the
# speech models in this project expect.
sample_rate = 16000

# Number of audio channels. 1 = mono. The voice pipeline is mono end to end.
channels = 1

# Length of one audio "frame" in milliseconds. Audio is processed in small
# fixed-size chunks; 20 ms is a common frame size for voice pipelines.
frame_ms = 20

[gateway]
# How often (in seconds) the WebSocket gateway logs how many valid audio
# frames arrived in the last interval. 1.0 gives the "about 50 frames per
# second" heartbeat. Tests override this to a tiny value to avoid real waits.
frame_log_interval_s = 1.0

# When true, every valid frame the server receives is echoed straight back to
# the client, bracketed by audio.start / audio.end. This is the day-3 loopback
# used to prove the return audio path end to end; it is switched off once the
# real voice pipeline produces the audio instead.
echo_enabled = true
