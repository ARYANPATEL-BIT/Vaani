# config.toml — non-secret runtime settings for the Vaani backend.
#
# Everything here is safe to commit and to read in a code review. Secrets
# (API keys, tokens) NEVER live in this file; they arrive only from
# environment variables. See .env.example for the secret names.
#
# This file is read into the typed Settings object in vaani/config.py.

# Human-readable application name (used as the FastAPI/OpenAPI title).
app_name = "vaani"

[audio]
# Samples of audio captured per second. 16000 Hz (16 kHz) is the rate the
# speech models in this project expect.
sample_rate = 16000

# Number of audio channels. 1 = mono. The voice pipeline is mono end to end.
channels = 1

# Length of one audio "frame" in milliseconds. Audio is processed in small
# fixed-size chunks; 20 ms is a common frame size for voice pipelines.
frame_ms = 20

[gateway]
# How often (in seconds) the WebSocket gateway logs how many valid audio
# frames arrived in the last interval. 1.0 gives the "about 50 frames per
# second" heartbeat. Tests override this to a tiny value to avoid real waits.
frame_log_interval_s = 1.0

# When true, every valid frame the server receives is echoed straight back to
# the client, bracketed by audio.start / audio.end. This is the day-3 loopback
# used to prove the return audio path end to end; it is switched off once the
# real voice pipeline produces the audio instead.
echo_enabled = true

[llm]
# Language model providers, first choice first. If one is rate-limited, times
# out or is unreachable BEFORE it has said anything, the next one is tried.
# Every provider listed here must have its API key set, or startup fails.
provider_order = ["gemini", "groq"]

# Per-process cap on paid LLM requests, shared by EVERY provider: a failover
# is another counted request, not a way around the cap. Every call is counted
# when it is dispatched, success or not; past the cap, calls are refused
# before any network traffic. A stopgap until the real cost ledger exists.
max_requests_per_process = 200

[llm.gemini]
# Exact model ID. Deliberately NOT the "gemini-flash-lite-latest" alias: an
# alias can silently move to a new model and change our latency numbers.
model = "gemini-3.5-flash-lite"

# REST API root. The API key is NOT here — it comes only from the
# VAANI_GEMINI_API_KEY environment variable (or the gitignored backend/.env).
base_url = "https://generativelanguage.googleapis.com/v1beta"

# Seconds to wait for each step of a request: connecting, the first byte, and
# each following chunk. It does not cap the total length of a long answer.
timeout_s = 10.0

# How much the model reasons before its first token. "minimal" is the lowest
# level this model accepts; thinking happens before the first token, so it
# adds directly to time-to-first-token.
thinking_level = "minimal"

[llm.groq]
# Exact model ID, as returned by Groq's GET /openai/v1/models for our key.
# MODEL_PLACEHOLDER
model = "llama-3.1-8b-instant"

# Groq's OpenAI-compatible API root. The key comes only from the
# VAANI_GROQ_API_KEY environment variable (or the gitignored backend/.env).
base_url = "https://api.groq.com/openai/v1"

# Seconds to wait for each step of a request, as for Gemini.
timeout_s = 10.0

# reasoning_effort / include_reasoning: only for reasoning models such as
# openai/gpt-oss-20b. Leave them out for any other model; it rejects them.
