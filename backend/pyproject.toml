# pyproject.toml — the single source of truth for the backend Python project.
# Declares the package, its runtime dependencies, dev/test tools, and the
# configuration for ruff (lint) and pytest (tests). Managed with uv; the exact
# resolved versions are frozen in uv.lock (committed next to this file).

[project]
name = "vaani"
version = "0.1.0"
description = "Vaani backend — real-time, interruptible voice agent gateway."
requires-python = ">=3.11"

# Runtime dependencies only. Lower bounds are the minimum versions whose
# behaviour we rely on; uv.lock pins the exact version actually installed.
dependencies = [
    "fastapi>=0.110",           # web framework: routing, validation, ASGI app
    "uvicorn[standard]>=0.29",  # ASGI server + WebSocket support (websockets)
    "pydantic-settings>=2.2",   # typed settings from TOML + env (has TOML source)
    "httpx>=0.27",              # async HTTP client; LLM provider calls (streaming)
    "onnxruntime>=1.18",        # runs the Silero VAD model on CPU, no torch
    "numpy>=1.26",              # audio sample arrays fed to onnxruntime
]

[dependency-groups]
# Tools needed to develop and test, but not to run in production.
dev = [
    "pytest>=8.0",      # test runner
    "ruff>=0.5",        # linter and formatter
    "websockets>=12.0", # WebSocket client used by scripts/fake_client.py
]

[build-system]
# hatchling builds the installable package so `import vaani` works everywhere
# (in tests, in uvicorn) after `uv sync`.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable package is backend/vaani/.
packages = ["vaani"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: pyupgrade,
# B: bug-prone patterns. A small, well-understood set for a fresh repo.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
